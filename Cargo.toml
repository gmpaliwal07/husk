[package]
name = "husk"
version = "0.1.0"
edition = "2021"
description = "Back up a Linux setup into one signed, encrypted file and restore it on a fresh install"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dialoguer = "0.11"
walkdir = "2"
zstd = "0.13"
tar = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
age = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
toml = "0.8"
globset = "0.4"
glob = "0.3"
