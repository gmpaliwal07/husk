install_hint = "Android Studio (https://developer.android.com/studio) or via JetBrains Toolbox"

[[app]]
id = "google_chrome"
display_name = "Google Chrome (bookmarks only)"
detect_binary = "google-chrome-stable"
detect_paths = ["~/.config/google-chrome"]
# Bookmarks is a plain JSON file with bookmarks only; it holds no history, cookies, or
# saved passwords. Extensions are deliberately not captured: their packaged code and IDs
# aren't portable, and the reliable way to get them back is signing into Chrome Sync.
capture_globs = ["~/.config/google-chrome/Default/Bookmarks", "~/.config/google-chrome/Profile */Bookmarks"]
install_hint = "Google Chrome (https://www.google.com/chrome/); sign into Chrome Sync afterwards to restore extensions"

[[app]]
id = "firefox"
display_name = "Firefox (bookmarks only)"
detect_binary = "firefox"
detect_paths = ["~/.mozilla/firefox"]
# Firefox periodically writes bookmark-only snapshots here (no history, no cookies,
# no saved passwords) as compressed JSON; restoring means importing the newest one via
# Bookmarks > Manage Bookmarks > Import Backup. Extensions: sign into Firefox Sync.
capture_globs = ["~/.mozilla/firefox/*.default*/bookmarkbackups/*.jsonlz4"]
install_hint = "Firefox (https://www.mozilla.org/firefox/); sign into Firefox Sync afterwards to restore extensions"
