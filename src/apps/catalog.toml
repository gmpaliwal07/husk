[[app]]
id = "jetbrains_idea"
display_name = "JetBrains IntelliJ IDEA (settings only)"
detect_paths = ["~/.config/JetBrains/IntelliJIdea*", "~/.config/JetBrains/IdeaIC*"]
capture_globs = [
  "~/.config/JetBrains/IntelliJIdea*/options/*.xml",
  "~/.config/JetBrains/IntelliJIdea*/keymaps/*.xml",
  "~/.config/JetBrains/IntelliJIdea*/codestyles/*.xml",
  "~/.config/JetBrains/IdeaIC*/options/*.xml",
  "~/.config/JetBrains/IdeaIC*/keymaps/*.xml",
  "~/.config/JetBrains/IdeaIC*/codestyles/*.xml",
]
# Project lists and stored credentials stay out of the backup.
exclude_globs = ["**/recentProjects.xml", "**/recentSolutions.xml", "**/security.xml", "**/*token*", "**/*password*"]
install_hint = "IntelliJ IDEA (JetBrains Toolbox: https://www.jetbrains.com/toolbox-app/)"

