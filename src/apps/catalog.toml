# Built-in catalog of simple apps: detect, copy config files, optionally hint how to
# install. Each entry becomes one generic handler (see src/apps/generic.rs).
#
# Users extend or override this with ~/.config/husk/apps.toml (same format); an entry
# with the same `id` replaces the built-in one.
#
# Fields:
#   id            [a-z0-9_-]+, stable; also the key under [software] in backup.toml
#   display_name  shown in the backup plan
#   detect_binary binary looked up on PATH                       (optional)
#   detect_paths  any existing path marks the app present (OR)   (optional)
#   capture_files exact files copied verbatim                    (optional)
#   capture_globs glob patterns expanded at capture time         (optional)
#   exclude_globs globs removed from the captured set            (optional)
#   install_hint  text shown on restore if the app is missing; NEVER executed
# `~` expands to $HOME. At least one of detect_binary / detect_paths is required.

[[app]]
id = "tmux"
display_name = "tmux"
detect_binary = "tmux"
detect_paths = ["~/.tmux.conf", "~/.config/tmux"]
capture_files = ["~/.tmux.conf", "~/.config/tmux/tmux.conf"]
capture_globs = ["~/.config/tmux/*.conf"]
# Plugins are NOT captured: tpm re-installs everything listed as `@plugin` in
# tmux.conf, and recreating empty plugin dirs would make tpm think they are installed.
install_hint = "install tmux (package: tmux); then press prefix + I inside tmux so tpm installs the plugins listed in tmux.conf"

